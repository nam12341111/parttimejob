name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DOTNET_VERSION: "9.0.x"
  IMAGE_NAME: part-time-jobs-api

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  docker-build-push:
    name: Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: none
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Data Preprocessing
        run: |
          echo "REPO_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy Locally (Self-Hosted)
    needs: docker-build-push
    # CHANGE: Run on your local machine
    runs-on: self-hosted
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull & Deploy
        run: |
          $REPO_NAME = "${{ github.repository }}".ToLower()
          $IMAGE_NAME = "part-time-jobs-api"
          $FULL_IMAGE = "ghcr.io/$REPO_NAME/$IMAGE_NAME:latest"

          Write-Host "Deploying $FULL_IMAGE..."

          docker pull $FULL_IMAGE

          # Stop and remove existing container, ignoring stderr if not exists
          docker stop $IMAGE_NAME 2> $null
          docker rm $IMAGE_NAME 2> $null

          # Run new container
          # Using host.docker.internal to connect to your SQL Server running in Docker Desktop
          docker run -d `
            --name $IMAGE_NAME `
            --restart unless-stopped `
            -p 8080:8080 `
            -e ConnectionStrings__Default="Server=host.docker.internal,1433;Database=PartTimeJobs;User Id=sa;Password=PartTimeJobs@2024;TrustServerCertificate=True;MultipleActiveResultSets=true" `
            $FULL_IMAGE
            
          # Cleanup
          docker image prune -f
