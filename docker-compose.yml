services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ptj_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PartTimeJobs@2024
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./hello_2.bak:/var/opt/mssql/backup/hello_2.bak:ro
      - ./mssql/restore-db.sql:/var/opt/mssql/scripts/restore-db.sql:ro
      - ./mssql/entrypoint.sh:/var/opt/mssql/entrypoint.sh:ro
    command: /bin/bash -c "/var/opt/mssql/entrypoint.sh & /opt/mssql/bin/sqlservr"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P PartTimeJobs@2024 -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 3s

  api:
    image: part-time-jobs-api
    container_name: ptj_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      # ENV
      - ASPNETCORE_ENVIRONMENT=Development

      # DB
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PartTimeJobDb;User Id=sa;Password=PartTimeJobs@2024;TrustServerCertificate=True;

      # 🔐 JWT (lấy từ Jenkins)
      - JWT__Key=${JWT__Key}
      - JWT__Issuer=PTJ.API
      - JWT__Audience=PTJ.Client

      # 🔐 API KEY (lấy từ Jenkins)
      - AI__OpenAI__ApiKey=${AI__OpenAI__ApiKey}

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sql_data:
