services:
  sqlserver:
    build:
      context: .
      dockerfile: mssql/Dockerfile
    container_name: ptj_sqlserver
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P PartTimeJobs@2024 -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 3s

  api:
    image: part-time-jobs-api
    container_name: ptj_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      # ENV
      - ASPNETCORE_ENVIRONMENT=Development

      # DB
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PartTimeJobDb;User Id=sa;Password=PartTimeJobs@2024;TrustServerCertificate=True;

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sql_data:
